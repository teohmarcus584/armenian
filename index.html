<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 Printer MAC Scanner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    color: #e2e8f0;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    max-width: 720px;
    width: 100%;
    background: #1e293b;
    border-radius: 24px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 1px solid #334155;
  }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 8px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .subtitle {
    color: #94a3b8;
    margin-bottom: 28px;
    font-size: 0.95rem;
  }
  .config-section {
    background: #0f172a;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 24px;
    border: 1px solid #334155;
  }
  label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    color: #cbd5e1;
    font-size: 0.9rem;
  }
  input[type="text"] {
    width: 100%;
    padding: 14px 18px;
    border-radius: 12px;
    border: 2px solid #334155;
    background: #1e293b;
    color: #fff;
    font-size: 1rem;
    font-family: 'Courier New', monospace;
    transition: all 0.2s;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
  }
  .hint {
    font-size: 0.75rem;
    color: #64748b;
    margin-top: 6px;
  }
  .btn-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 20px;
  }
  button {
    padding: 14px 24px;
    border-radius: 12px;
    border: none;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .btn-primary {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    color: white;
    box-shadow: 0 4px 14px rgba(59,130,246,0.4);
  }
  .btn-primary:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(59,130,246,0.5);
  }
  .btn-success {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: white;
    box-shadow: 0 4px 14px rgba(16,185,129,0.4);
  }
  .btn-success:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(16,185,129,0.5);
  }
  .btn-secondary {
    background: #334155;
    color: #cbd5e1;
  }
  .btn-secondary:hover:not(:disabled) {
    background: #475569;
  }
  .status-box {
    padding: 16px 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 10px;
    border-left: 4px solid #3b82f6;
    background: #0f172a;
  }
  .status-box.success {
    border-left-color: #10b981;
    background: rgba(16,185,129,0.1);
    color: #6ee7b7;
  }
  .status-box.error {
    border-left-color: #ef4444;
    background: rgba(239,68,68,0.1);
    color: #fca5a5;
  }
  .status-box.warning {
    border-left-color: #f59e0b;
    background: rgba(245,158,11,0.1);
    color: #fcd34d;
  }
  .devices-section {
    margin-top: 24px;
  }
  .devices-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .devices-header h2 {
    font-size: 1.1rem;
    color: #fff;
  }
  .device-count {
    background: #334155;
    color: #cbd5e1;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .device-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 420px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .device-item {
    background: #0f172a;
    border-radius: 14px;
    padding: 16px 18px;
    border: 2px solid #334155;
    transition: all 0.2s;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .device-item:hover {
    border-color: #3b82f6;
    transform: translateX(4px);
    background: #1a2332;
  }
  .device-item.selected {
    border-color: #10b981;
    background: rgba(16,185,129,0.1);
  }
  .device-info {
    flex: 1;
    min-width: 0;
  }
  .device-name {
    font-weight: 700;
    font-size: 1.05rem;
    color: #fff;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .device-mac {
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    color: #60a5fa;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .device-meta {
    font-size: 0.8rem;
    color: #94a3b8;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .signal-bars {
    display: inline-flex;
    gap: 2px;
    align-items: flex-end;
    height: 16px;
  }
  .signal-bar {
    width: 4px;
    background: #475569;
    border-radius: 1px;
  }
  .signal-bar.active {
    background: #10b981;
  }
  .signal-bar:nth-child(1) { height: 4px; }
  .signal-bar:nth-child(2) { height: 8px; }
  .signal-bar:nth-child(3) { height: 12px; }
  .signal-bar:nth-child(4) { height: 16px; }
  
  .device-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .device-actions button {
    padding: 8px 16px;
    font-size: 0.8rem;
  }
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #64748b;
  }
  .empty-state .icon {
    font-size: 3rem;
    margin-bottom: 12px;
    opacity: 0.5;
  }
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .badge-printer {
    background: #10b981;
    color: white;
    font-size: 0.65rem;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .badge-unknown {
    background: #64748b;
    color: white;
    font-size: 0.65rem;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 700;
  }
  .log-section {
    margin-top: 20px;
    background: #0f172a;
    border-radius: 12px;
    padding: 12px 16px;
    max-height: 140px;
    overflow-y: auto;
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    color: #94a3b8;
    border: 1px solid #334155;
  }
  .log-entry { padding: 2px 0; }
  .log-entry.error { color: #fca5a5; }
  .log-entry.success { color: #6ee7b7; }
  .log-entry.info { color: #93c5fd; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #0f172a; border-radius: 4px; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #475569; }
</style>
</head>
<body>
<div class="container">
  <h1>🖨️ ESP32 Printer MAC Scanner</h1>
  <p class="subtitle">Find and save your Bluetooth printer's MAC address via ESP32</p>

  <!-- ESP32 IP Config -->
  <div class="config-section">
    <label for="esp32Ip">ESP32 IP Address</label>
    <input type="text" id="esp32Ip" value="192.168.0.108" placeholder="e.g., 192.168.0.108">
    <div class="hint">💡 Check your ESP32 serial monitor after it connects to WiFi</div>

    <div class="btn-row">
      <button class="btn-primary" id="testBtn">
        🔌 Test Connection
      </button>
      <button class="btn-success" id="scanBtn" disabled>
        📡 Scan for Printers
      </button>
      <button class="btn-secondary" id="clearLogBtn">
        🗑️ Clear Log
      </button>
    </div>
  </div>

  <!-- Status -->
  <div id="statusBox" class="status-box">
    <span>⚪</span>
    <span>Enter ESP32 IP and click "Test Connection"</span>
  </div>

  <!-- Devices -->
  <div class="devices-section" id="devicesSection" style="display: none;">
    <div class="devices-header">
      <h2>📱 Found Devices</h2>
      <span class="device-count" id="deviceCount">0</span>
    </div>
    <div class="device-list" id="deviceList"></div>
  </div>

  <!-- Log -->
  <div class="log-section" id="logSection">
    <div class="log-entry info">[system] Ready. Waiting for ESP32 IP...</div>
  </div>
</div>

<script>
// ==================== STATE ====================
let esp32Url = 'http://192.168.0.108';
let isConnected = false;

// ==================== DOM ====================
const ipInput = document.getElementById('esp32Ip');
const testBtn = document.getElementById('testBtn');
const scanBtn = document.getElementById('scanBtn');
const clearLogBtn = document.getElementById('clearLogBtn');
const statusBox = document.getElementById('statusBox');
const devicesSection = document.getElementById('devicesSection');
const deviceList = document.getElementById('deviceList');
const deviceCount = document.getElementById('deviceCount');
const logSection = document.getElementById('logSection');

// Load saved IP
const savedIp = localStorage.getItem('esp32_scanner_ip');
if (savedIp) ipInput.value = savedIp.replace('http://', '').replace('https://', '');

// ==================== LOG ====================
function log(message, type = 'info') {
  const time = new Date().toLocaleTimeString();
  const entry = document.createElement('div');
  entry.className = `log-entry ${type}`;
  entry.textContent = `[${time}] ${message}`;
  logSection.appendChild(entry);
  logSection.scrollTop = logSection.scrollHeight;
  
  // Keep log size reasonable
  while (logSection.children.length > 100) {
    logSection.removeChild(logSection.firstChild);
  }
}

// ==================== STATUS ====================
function setStatus(icon, message, type = '') {
  statusBox.className = 'status-box' + (type ? ' ' + type : '');
  statusBox.innerHTML = `<span>${icon}</span><span>${message}</span>`;
}

// ==================== NORMALIZE URL ====================
function normalizeUrl(input) {
  let url = input.trim();
  if (!url) return null;
  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    url = 'http://' + url;
  }
  // Remove trailing slash
  url = url.replace(/\/+$/, '');
  return url;
}

// ==================== TEST CONNECTION ====================
async function testConnection() {
  const url = normalizeUrl(ipInput.value);
  if (!url) {
    setStatus('❌', 'Please enter a valid IP address', 'error');
    return;
  }
  
  esp32Url = url;
  localStorage.setItem('esp32_scanner_ip', url);
  
  setStatus('🔄', `Testing connection to ${url}...`, 'warning');
  log(`Testing: ${url}/status`);
  testBtn.disabled = true;
  scanBtn.disabled = true;
  
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 6000);
    
    const res = await fetch(`${esp32Url}/status`, {
      signal: controller.signal,
      cache: 'no-store'
    });
    clearTimeout(timeoutId);
    
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }
    
    const data = await res.json();
    isConnected = true;
    
    setStatus('✅', 
      `Connected to ESP32! BT: ${data.bt_connected ? 'Connected (' + (data.mac || '?') + ')' : 'Not connected'}`, 
      'success'
    );
    log(`✅ ESP32 responded: ${JSON.stringify(data)}`, 'success');
    
    scanBtn.disabled = false;
    
  } catch (err) {
    isConnected = false;
    let msg = err.message;
    if (err.name === 'AbortError') msg = 'Timeout — ESP32 not responding';
    if (msg.includes('Failed to fetch')) msg = 'Cannot reach ESP32. Check IP & WiFi.';
    
    setStatus('❌', msg, 'error');
    log(`❌ Connection failed: ${msg}`, 'error');
    scanBtn.disabled = true;
    devicesSection.style.display = 'none';
  } finally {
    testBtn.disabled = false;
  }
}

// ==================== SCAN FOR PRINTERS ====================
async function scanForPrinters() {
  if (!isConnected) {
    setStatus('❌', 'Not connected to ESP32', 'error');
    return;
  }
  
  setStatus('🔄', 'Scanning for Bluetooth devices... This may take 10-30 seconds', 'warning');
  log('📡 Starting BT scan...');
  scanBtn.disabled = true;
  scanBtn.innerHTML = '<span class="spinner"></span> Scanning...';
  deviceList.innerHTML = '';
  devicesSection.style.display = 'none';
  
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 60000); // 60s for scan
    
    const res = await fetch(`${esp32Url}/bt/scan`, {
      signal: controller.signal,
      cache: 'no-store'
    });
    clearTimeout(timeoutId);
    
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }
    
    const data = await res.json();
    
    if (!data.ok) {
      throw new Error(data.error || 'Scan failed');
    }
    
    const devices = data.devices || [];
    log(`✅ Found ${devices.length} device(s)`, 'success');
    
    if (devices.length === 0) {
      setStatus('📭', 'No Bluetooth devices found. Make sure your printer is ON and nearby.', 'warning');
      return;
    }
    
    renderDevices(devices);
    setStatus('✅', `Found ${devices.length} device(s). Click one to save.`, 'success');
    
  } catch (err) {
    let msg = err.message;
    if (err.name === 'AbortError') msg = 'Scan timeout (60s)';
    setStatus('❌', `Scan failed: ${msg}`, 'error');
    log(`❌ Scan failed: ${msg}`, 'error');
  } finally {
    scanBtn.disabled = false;
    scanBtn.innerHTML = '📡 Scan for Printers';
  }
}

// ==================== RENDER DEVICES ====================
function renderDevices(devices) {
  deviceList.innerHTML = '';
  deviceCount.textContent = devices.length;
  
  // Sort: likely printers first, then by RSSI
  devices.sort((a, b) => {
    const aP = isPrinterName(a.name) ? 1 : 0;
    const bP = isPrinterName(b.name) ? 1 : 0;
    if (aP !== bP) return bP - aP;
    return (b.rssi || -100) - (a.rssi || -100);
  });
  
  devices.forEach((device, idx) => {
    const item = document.createElement('div');
    item.className = 'device-item';
    
    const isPrinter = isPrinterName(device.name);
    const signalLevel = getSignalLevel(device.rssi);
    const rssiText = device.rssi ? `${device.rssi} dBm` : 'N/A';
    
    item.innerHTML = `
      <div class="device-info">
        <div class="device-name">
          ${isPrinter ? '🖨️' : '📱'} 
          ${escapeHtml(device.name || '(Unknown Device)')}
          ${isPrinter 
            ? '<span class="badge-printer">LIKELY PRINTER</span>' 
            : '<span class="badge-unknown">UNKNOWN</span>'}
        </div>
        <div class="device-mac">${device.mac || 'N/A'}</div>
        <div class="device-meta">
          <span>📶 ${rssiText}</span>
          <span class="signal-bars">
            ${[1,2,3,4].map(n => 
              `<span class="signal-bar ${n <= signalLevel ? 'active' : ''}"></span>`
            ).join('')}
          </span>
        </div>
      </div>
      <div class="device-actions">
        <button class="btn-success save-btn" data-mac="${device.mac}" data-name="${escapeHtml(device.name || '')}">
          💾 Save MAC
        </button>
      </div>
    `;
    
    // Save MAC button
    item.querySelector('.save-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      saveMacToEsp32(device.mac, device.name, item);
    });
    
    deviceList.appendChild(item);
  });
  
  devicesSection.style.display = 'block';
}

// ==================== SAVE MAC TO ESP32 ====================
async function saveMacToEsp32(mac, name, itemEl) {
  if (!mac) {
    setStatus('❌', 'No MAC address available', 'error');
    return;
  }
  
  const confirmed = confirm(
    `Save this printer to ESP32?\n\n` +
    `Name: ${name || '(Unknown)'}\n` +
    `MAC:  ${mac}\n\n` +
    `The ESP32 will remember this printer and auto-connect on boot.`
  );
  if (!confirmed) return;
  
  setStatus('🔄', `Saving MAC ${mac} to ESP32...`, 'warning');
  log(`💾 Saving MAC: ${mac}`);
  
  const saveBtn = itemEl.querySelector('.save-btn');
  const originalText = saveBtn.innerHTML;
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<span class="spinner"></span>';
  
  try {
    const res = await fetch(`${esp32Url}/bt/save`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mac: mac, name: name }),
      cache: 'no-store'
    });
    
    const data = await res.json();
    
    if (!data.ok) {
      throw new Error(data.error || 'Save failed');
    }
    
    setStatus('✅', `MAC saved! ESP32 will auto-connect to ${name || mac} on boot.`, 'success');
    log(`✅ Saved MAC: ${mac}`, 'success');
    
    itemEl.classList.add('selected');
    saveBtn.innerHTML = '✅ Saved';
    
    // Also save to browser localStorage for convenience
    localStorage.setItem('saved_printer_mac', mac);
    localStorage.setItem('saved_printer_name', name || '');
    
    setTimeout(() => {
      saveBtn.disabled = false;
      saveBtn.innerHTML = originalText;
    }, 3000);
    
  } catch (err) {
    setStatus('❌', `Save failed: ${err.message}`, 'error');
    log(`❌ Save failed: ${err.message}`, 'error');
    saveBtn.disabled = false;
    saveBtn.innerHTML = originalText;
  }
}

// ==================== HELPERS ====================
function isPrinterName(name) {
  if (!name) return false;
  const lower = name.toLowerCase();
  const printerKeywords = [
    'print', 'pos', 'thermal', 'receipt', 'xp-', 'xp_',
    'mtp', 'rpp', 'goojprt', 'xprinter', 'epson', 'star',
    'zebra', 'citizen', 'bixolon', 'snbc', 'rongta'
  ];
  return printerKeywords.some(kw => lower.includes(kw));
}

function getSignalLevel(rssi) {
  if (!rssi) return 0;
  if (rssi >= -50) return 4;
  if (rssi >= -65) return 3;
  if (rssi >= -80) return 2;
  if (rssi >= -90) return 1;
  return 0;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}

// ==================== EVENT LISTENERS ====================
testBtn.addEventListener('click', testConnection);
scanBtn.addEventListener('click', scanForPrinters);
clearLogBtn.addEventListener('click', () => {
  logSection.innerHTML = '<div class="log-entry info">[system] Log cleared</div>';
});

ipInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') testConnection();
});

// Auto-test on load if IP is saved
window.addEventListener('load', () => {
  if (savedIp) {
    log('ℹ️ Found saved IP. Auto-testing...');
    setTimeout(testConnection, 500);
  }
});
</script>
</body>
</html>
